name: Codex Apply Roman TD Patch

on:
  push:
    paths:
      - '.codex-patches/publish-940343e.patch'
      - '.github/workflows/codex-apply-roman-td-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Codex patch and clean helper files
        run: |
          set -euo pipefail
          PATCH_FILE=".codex-patches/publish-940343e.patch"
          if [ ! -f "$PATCH_FILE" ]; then
            echo "Patch file not found: $PATCH_FILE"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git apply --check "$PATCH_FILE"
          git apply "$PATCH_FILE"
          rm -f "$PATCH_FILE" ".github/workflows/codex-apply-roman-td-patch.yml"
          rmdir .codex-patches 2>/dev/null || true
          git add -A
          git commit -m "Publish Roman TD Solo updates"
          git push

# Deploy Roman TD to GitHub Pages on every push to main.
#
# Pipeline:
#   1. Checkout the repo + set up Node.
#   2. Install dependencies.
#   3. Run the vitest suite as a gate — if tests fail, no deploy happens.
#   4. Build the production bundle via `npm run build` (this runs `tsc &&
#      vite build`). Vite's `base: './'` in vite.config.ts produces fully
#      relative asset URLs, so the same bundle works under any path
#      including the GitHub-Pages project-page URL `/<repo>/`.
#   5. Publish `dist/` to the `gh-pages` branch, which is the repo's Pages
#      source.
#
# After the first successful run, the site is live at
#   https://falatua.github.io/roman-td/
# and every subsequent push to main re-deploys automatically.
name: Deploy to GitHub Pages

on:
  # Run on every push to main so the public build tracks the latest code.
  push:
    branches: [main]
  # Allow manual re-runs from the Actions tab (handy for re-deploying after
  # changing repo settings without touching code).
  workflow_dispatch:

# The workflow publishes the built site to the `gh-pages` branch.
permissions:
  contents: write

# Cancel any in-flight deploy when a newer commit lands — only the latest
# main commit should ever be live.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # Use `npm install` rather than `npm ci`. The lockfile and
        # package.json drift slightly when transitive dependencies update
        # locally; `npm install` reconciles them rather than failing. We
        # don't need bit-for-bit reproducibility for a public game build.
        run: npm install --no-audit --no-fund

      # Test gate — if any of the 260 vitest cases fail, the deploy stops
      # here. The error surfaces in the Actions log so the next push can
      # fix it. No silent breakage on the public build.
      - name: Run test suite
        run: npm test

      - name: Build production bundle
        # 2026-05-19 — Inject Supabase leaderboard credentials from repo
        # secrets so the deployed bundle can talk to the global
        # leaderboard. When the secrets aren't set the bundle still
        # builds; the game just falls back to localStorage-only
        # leaderboards (see LEADERBOARD_SETUP.md). Both vars must
        # start with VITE_ to make it into the client bundle.
        env:
          VITE_SUPABASE_URL:      ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # 2026-05-19 — Optional Cloudflare Worker proxy URL. When set,
          # the bundle routes leaderboard requests through this domain
          # instead of *.supabase.co. Used to bypass player-network
          # mishandling of supabase.co URLs (real PGRST125 reports).
          # Setup steps live in cloudflare-worker/. When unset the
          # bundle hits Supabase directly (existing behavior).
          VITE_LEADERBOARD_PROXY_URL: ${{ secrets.VITE_LEADERBOARD_PROXY_URL }}
        run: npm run build

      - name: Publish dist to gh-pages
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/roman-td-pages
          mkdir -p /tmp/roman-td-pages
          cp -R dist/. /tmp/roman-td-pages/
          touch /tmp/roman-td-pages/.nojekyll
          git fetch origin gh-pages || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add /tmp/roman-td-gh-pages origin/gh-pages
            cd /tmp/roman-td-gh-pages
          else
            git worktree add --detach /tmp/roman-td-gh-pages
            cd /tmp/roman-td-gh-pages
            git checkout --orphan gh-pages
          fi
          git rm -r --ignore-unmatch . >/dev/null 2>&1 || true
          cp -R /tmp/roman-td-pages/. .
          git add .
          git commit -m "Deploy Roman TD ${GITHUB_SHA::7}" || exit 0
          git push origin HEAD:gh-pages
